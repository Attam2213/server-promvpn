<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>VPN/VDS Manager - Вход</title>
    <script>
      (function(){
        var FORCE = "20260902a";
        try {
          var u = new URL(window.location.href);
          if (u.searchParams.get("v") !== FORCE) {
            u.searchParams.set("v", FORCE);
            u.searchParams.delete("debug");
            if (window.location.search !== u.search) {
              window.location.replace(u.toString());
              return;
            }
          }
        } catch(e){
          var loc = window.location;
          var q = loc.search;
          if (q.indexOf("v=" + FORCE) === -1) {
            window.location.replace(loc.pathname + "?v=" + FORCE + loc.hash);
            return;
          }
        }
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=20260902a" />
  </head>
  <body>
    <div class="login-layout">
      <div class="login-card panel">
        <div class="login-header">
          <div class="login-logo">🛡️</div>
          <p class="eyebrow">VPN/VDS Manager</p>
          <h1>Вход в <span class="title-accent">систему</span></h1>
          <p class="subtitle">Введите учетные данные для доступа к панели управления.</p>
        </div>

        <form id="login-form" class="login-form" novalidate onsubmit="event.preventDefault(); if(window._loginSubmit){ window._loginSubmit(); return false; } return false;">
          <label class="field">
            <span class="field-label">Логин</span>
            <input
              class="field-input"
              type="text"
              id="username"
              name="username"
              placeholder="Введите логин"
              autocomplete="username"
              required
            />
            <span class="field-error" data-error-for="username"></span>
          </label>

          <label class="field">
            <span class="field-label">Пароль</span>
            <input
              class="field-input"
              type="password"
              id="password"
              name="password"
              placeholder="Введите пароль"
              autocomplete="current-password"
              required
            />
            <span class="field-error" data-error-for="password"></span>
          </label>

          <button type="submit" id="login-btn" class="btn btn-primary btn-login">
            Войти
          </button>
        </form>

        <div id="login-status" class="status status-loading" style="display: none;"></div>
      </div>
    </div>

    <script defer src="app.js?v=20260902a"></script>
  </body>
</html>
