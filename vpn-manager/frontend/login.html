<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>VPN/VDS Manager - Вход</title>
    <link rel="stylesheet" href="styles.css?v=20260831" />
  </head>
  <body>
    <div class="login-layout">
      <div class="login-card panel">
        <div class="login-header">
          <p class="eyebrow">VPN/VDS Manager</p>
          <h1>Вход в систему</h1>
          <p class="subtitle">Введите учетные данные для доступа к панели управления.</p>
        </div>

        <form id="login-form" class="login-form" novalidate onsubmit="return false;">
          <label class="field">
            <span class="field-label">Логин</span>
            <input
              class="field-input"
              type="text"
              id="username"
              name="username"
              placeholder="Введите логин"
              autocomplete="username"
              required
            />
            <span class="field-error" data-error-for="username"></span>
          </label>

          <label class="field">
            <span class="field-label">Пароль</span>
            <input
              class="field-input"
              type="password"
              id="password"
              name="password"
              placeholder="Введите пароль"
              autocomplete="current-password"
              required
            />
            <span class="field-error" data-error-for="password"></span>
          </label>

          <button type="submit" id="login-btn" class="btn btn-primary btn-login">
            Войти
          </button>
        </form>

        <div id="login-status" class="status status-loading" style="display: none;"></div>
      </div>
    </div>

    <script defer src="app.js?v=20260831"></script>
  </body>
</html>
